<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="format-detection" content="telephone=no">
  <title>Gym</title>
  <script>
    (function () {
      var p = localStorage.getItem('gymlog-theme') || 'dark';
      var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
      document.documentElement.dataset.theme = t;
      if (t === 'light') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f2ef');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
      }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"><div class="boot">Gym</div></main>
  <div id="minibar" hidden></div>
  <nav id="tabbar" aria-label="Navigation"></nav>
  <div id="editor" class="overlay editor" hidden></div>
  <div id="layer"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
