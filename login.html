<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <title>Gym – Anmelden</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="box">
    <img class="logo" src="icons/icon-192.png" alt="" width="84" height="84">
    <h1>Gym</h1>
    <p class="sub">Private App – bitte mit dem Konto anmelden, das du vom Admin bekommen hast.</p>
    <form id="f" autocomplete="on">
      <label><span>Benutzername</span><input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label><span>Passwort</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="err" hidden></p>
      <button type="submit" id="go">Anmelden</button>
    </form>
    <p class="hint">Noch kein Konto? Frag den Admin deiner Gruppe.</p>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
